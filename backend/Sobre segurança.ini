Após análise automatizada do seu projeto, não há indícios de risco de injeção de SQL:

Seu backend utiliza MongoDB com Mongoose, que é um banco NoSQL e não utiliza SQL para consultas.
As buscas, inserções e atualizações são feitas por métodos do Mongoose (find, findOne, update, etc.), que internamente fazem o tratamento dos parâmetros e não concatenam strings de consulta como ocorre em SQL puro.
Não há uso de métodos perigosos como $where ou eval em queries, que poderiam permitir injeção de código no MongoDB.
Resumo
Risco de injeção de SQL: Inexistente (pois não há SQL no projeto).
Risco de injeção de comandos no MongoDB: Baixo, desde que você não use $where, eval ou queries dinâmicas baseadas em input do usuário sem validação.
Recomendações
Continue usando apenas métodos do Mongoose para acessar o banco.
Nunca use $where ou eval em queries com dados vindos do usuário.
Sempre valide e sanitize os dados recebidos antes de usá-los em queries.
