Após análise do seu projeto, aqui está o panorama sobre o risco de ataques do tipo Cross-site Scripting (XSS):

Pontos de Atenção
O componente Agenda.js utiliza dangerouslySetInnerHTML para renderizar um iframe do Google Calendar. Neste caso, o conteúdo é fixo e controlado pelo desenvolvedor, então o risco de XSS é baixo, desde que não seja alterado para aceitar input do usuário.
O projeto utiliza ReactMarkdown para renderizar conteúdo em Markdown (ContentDetail.js). Por padrão, o ReactMarkdown é seguro e não executa HTML, mas se for habilitado o suporte a HTML ou plugins inseguros, pode haver risco.
Existe um utilitário sanitizeHtml.js usando DOMPurify, que é uma excelente prática para sanitizar HTML antes de renderizar.
Boas Práticas Presentes
Não há uso de eval, document.write, ou manipulação direta de HTML com input do usuário sem sanitização.
O uso de DOMPurify para sanitização de HTML é seguro.
O conteúdo Markdown é renderizado com ReactMarkdown, que é seguro por padrão.
Recomendações
Nunca use dangerouslySetInnerHTML com dados vindos do usuário sem passar por DOMPurify ou função similar.
Se algum dia precisar renderizar HTML vindo do usuário, sempre sanitize antes.
Se for habilitar HTML no ReactMarkdown, utilize o plugin rehype-sanitize para garantir segurança.
Mantenha dependências como DOMPurify e ReactMarkdown sempre atualizadas.

Resumo
No estado atual, o risco de XSS no seu projeto é baixo, pois não há renderização de HTML não sanitizado vindo do usuário.
Se quiser revisar algum ponto específico ou se algum conteúdo dinâmico for adicionado futuramente, sempre utilize sanitização.